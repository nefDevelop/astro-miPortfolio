<?xml version="1.0" encoding="UTF-8"?>
<!--
  Marca del sitio: fuente única del icono (favicon + marca del pie).

  Limpieza respecto al export original de Inkscape: se conservan solo los
  trazados dentro del viewBox (el resto eran iconos de otros proyectos
  dibujados fuera del lienzo) y se eliminan metadatos, guías y efectos de
  trazado, cuya geometría ya está resuelta en cada atributo `d`.

  El color va como `currentColor` a propósito: este archivo es un documento
  aislado cuando se sirve como favicon (allí el Layout fija el color con dos
  variantes data URI), pero inlineado en la página hereda el color de texto
  de la variable ink y sigue el tema al instante.
-->
